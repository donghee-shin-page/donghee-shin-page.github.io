publications:
  - title: "Offline Model-based Optimization for Real-World Molecular Discovery"
    link:
    image: "/images/molstitch.png"
    authors: "Dong-Hee Shin, Young-Han Son, Hyun Jung Lee, Deok-Joong Lee, Tae-Eui Kam"
    venue: "International Conference on Machine Learning (ICML), 2025"
    note: "Acceptance rate 26.9% | 3,260 of 12,107 submissions (excluding desk-rejected papers)"
    description_points: "We introduce a novel framework that stitches molecules from an offline dataset to generate new samples for fine-tuning the generative model even in offline settings."

  - title: "Population-based Evolutionary Search for Joint Hyperparameter and Architecture Optimization in Brain-Computer Interface"
    link: "https://www.sciencedirect.com/science/article/pii/S095741742402699X"
    image: "/images/evojoint.png"
    authors: "Dong-Hee Shin, Deok-Joong Lee, Ji-Wung Han, Young-Han Son, Tae-Eui Kam"
    venue: "Expert Systems with Applications (ESWA), 2025"
    note: "JCR Top 5.2% (IF: 7.5)"
    description_points: "We propose a joint optimization framework that leverages a population-based evolutionary search to optimize both hyperparameters and architectures in BCI."

  - title: "Dynamic Many-Objective Molecular Optimization: Unfolding Complexity with Objective Decomposition and Progressive Optimization"
    link: "https://openreview.net/pdf?id=pmfub8rn4W"
    image: "/images/dymol_po.png"
    authors: "Dong-Hee Shin, Young-Han Son, Deok-Joong Lee, Ji-Wung Han, Tae-Eui Kam"
    venue: "International Joint Conference on Artificial Intelligence (IJCAI), 2024"
    note: "Lead oral presentation (12 min) | Top 2.2% (128 of 5,651 submissions)"
    description_points: "We propose a novel method for tackling dynamic many-objective molecular optimization problem by utilizing objective decomposition and progressive optimization. \\ Objective Decomposition: our method decomposes complex many-objective sets into more manageable sub-problems facilitated by our decomposition module. \\ Progressive Optimization: The optimization process begins with a single objective and, as time stages progress, systematically incorporates each subsequent objective according to the decomposition order."

